document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"359c19fc-7239-4f84-a627-a50468853e66\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<script src=\"ada95d11-c7b1-4193-b58d-186a3f297e4e\"><\u002Fscript>\n<style>\n  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif; }\n  a { color:#2563a8; }\n  a:hover { color:#1a3a5c; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<sc-if value=\"{{ isNormalMode }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#f8fafc;min-height:100vh;color:#1e293b;font-size:14px;line-height:1.5;\">\n\n  <div style=\"background:linear-gradient(135deg,#1a3a5c 0%,#2563a8 100%);color:#fff;padding:20px 20px 16px;display:flex;flex-direction:column;gap:14px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;\">\n      <div>\n        <div style=\"font-size:20px;font-weight:700;letter-spacing:0.3px;margin:0 0 4px;\">Clinical Laboratory Dashboard<\u002Fdiv>\n        <div style=\"font-size:12px;opacity:0.85;max-width:320px;\">Comprehensive longitudinal record for physician review — not for self-diagnosis<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-end;\">\n        <div style=\"display:flex;gap:8px;\">\n          <button sc-camel-on-click=\"{{ exportBackup }}\" style=\"background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.45);color:#fff;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;\">💾 Backup Now<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openSettings }}\" style=\"background:#fff;color:#1a3a5c;border:none;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;\">⚙️ Settings<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;opacity:0.85;\">{{ backupStatusText }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:12px;opacity:0.95;background:rgba(255,255,255,0.1);border-radius:6px;padding:10px 14px;\">\n      <div><strong>Patient:<\u002Fstrong> <input value=\"{{ patient.name }}\" sc-camel-on-change=\"{{ onPatientName }}\" placeholder=\"Patient name\" style=\"background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.3);color:#fff;font-size:12px;font-weight:600;padding:0 0 1px;width:150px;\"><\u002Fdiv>\n      <div><strong>DOB:<\u002Fstrong> <input type=\"date\" value=\"{{ patient.dob }}\" sc-camel-on-change=\"{{ onPatientDob }}\" style=\"background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.3);color:#fff;font-size:12px;padding:0 0 1px;width:130px;\"><\u002Fdiv>\n      <div><strong>Age:<\u002Fstrong> {{ patientAgeText }} (<select value=\"{{ patient.sex }}\" sc-camel-on-change=\"{{ onPatientSex }}\" style=\"background:transparent;border:none;color:#fff;font-size:12px;padding:0;\">\n          <option value=\"\" style=\"color:#000;\">unspecified<\u002Foption>\n          <option value=\"male\" style=\"color:#000;\">male<\u002Foption>\n          <option value=\"female\" style=\"color:#000;\">female<\u002Foption>\n          <option value=\"other\" style=\"color:#000;\">other<\u002Foption>\n        <\u002Fselect>)<\u002Fdiv>\n      <div><strong>Span:<\u002Fstrong> {{ spanText }}<\u002Fdiv>\n      <div><strong>Labs:<\u002Fstrong> {{ labsSourceText }}<\u002Fdiv>\n      <div><strong>Generated:<\u002Fstrong> {{ generatedDateText }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasUnsavedChanges }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fffbeb;color:#78350f;border-left:4px solid #f59e0b;border-radius:6px;padding:8px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;\">\n        <span>⚠️ You have changes since your last backup. Download a fresh copy so you don't lose them.<\u002Fspan>\n        <button sc-camel-on-click=\"{{ exportBackup }}\" style=\"background:#f59e0b;color:#fff;border:none;border-radius:5px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;\">Backup Now<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,0.07);overflow-x:auto;\">\n    <div style=\"display:flex;padding:0 8px;\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"12\">\n        <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}\n          <sc-if value=\"{{ t.hasBadge }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:#dc2626;color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:6px;\">{{ t.badge }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:16px 12px 60px;max-width:1200px;margin:0 auto;\">\n\n    <sc-if value=\"{{ isSummary }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-if value=\"{{ hasDraws }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;\">\n          <div style=\"font-size:11px;color:#64748b;\">{{ narrativeStatusText }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ generateNarrativeSummary }}\" style=\"background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;\">{{ narrativeButtonLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasNarrativeError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fef2f2;color:#991b1b;border-left:4px solid #dc2626;border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:16px;\">{{ narrativeError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasNarrative }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#2563a8;background:#ebf3fc;border-left:4px solid #2563a8;padding:7px 12px;margin:0 0 14px;\">Current Status Snapshot — Most Recent Values<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px;\">\n            <sc-for list=\"{{ narrativeSnapshot }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <div style=\"{{ s.cardStyle }}\">\n                <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#64748b;\">{{ s.name }}<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:700;margin-top:4px;color:{{ s.valueColor }}\">{{ s.value }} <span style=\"font-size:11px;font-weight:400;color:#64748b;\">{{ s.unit }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:11px;color:#64748b;margin-top:4px;\">{{ s.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#2563a8;background:#ebf3fc;border-left:4px solid #2563a8;padding:7px 12px;margin:24px 0 12px;\">Active Clinical Flags — Priority Review<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:20px;\">\n            <sc-for list=\"{{ narrativeFlags }}\" as=\"fl\" hint-placeholder-count=\"4\">\n              <div style=\"{{ fl.boxStyle }}\">\n                <div style=\"{{ fl.titleStyle }}\">{{ fl.icon }} {{ fl.title }}<\u002Fdiv>\n                <div style=\"{{ fl.bodyStyle }}\">{{ fl.body }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noNarrativeYet }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px;\">\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px;\">\n              <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;\">Total Draws<\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:700;color:#1a3a5c;\">{{ summary.totalDraws }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px;\">\n              <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;\">Last Draw<\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:700;color:#1a3a5c;\">{{ summary.lastDateDisplay }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px;\">\n              <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;\">Critical Flags<\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:700;color:#dc2626;\">{{ summary.redCount }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:14px;\">\n              <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;\">High / Low Flags<\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:700;color:#d97706;\">{{ summary.amberCount }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasAbnormal }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#2563a8;background:#ebf3fc;border-left:4px solid #2563a8;padding:7px 12px;margin:0 0 12px;\">Needs Attention<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <sc-for list=\"{{ summary.abnormal }}\" as=\"t\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;gap:10px;\">\n                  <div>\n                    <div style=\"font-weight:700;font-size:13px;\">{{ t.name }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#64748b;\">{{ t.categoryLabel }} · {{ t.date }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right;\">\n                    <div style=\"font-weight:700;font-size:14px;color:{{ t.fg }}\">{{ t.value }} {{ t.unit }}<\u002Fdiv>\n                    <div style=\"font-size:10px;color:#64748b;\">ref {{ t.range }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"color:#64748b;font-size:12px;margin-top:8px;\">This is the basic view. Click “✨ Generate Clinical Summary” above for a full narrative report with trends and priority flags.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasTrends }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:24px 0 12px;\">\n            <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#2563a8;background:#ebf3fc;border-left:4px solid #2563a8;padding:7px 12px;\">10-Year Health Arc — Key Trends<\u002Fdiv>\n            <div style=\"display:flex;gap:6px;\">\n              <button sc-camel-on-click=\"{{ setTrendsViewTable }}\" style=\"{{ trendsTableBtnStyle }}\">📋 Table<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setTrendsViewCards }}\" style=\"{{ trendsCardsBtnStyle }}\">🗂️ Cards<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#64748b;margin:0 0 12px;\">Computed directly from your saved results.<\u002Fdiv>\n          <sc-if value=\"{{ isTrendsTableView }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-if value=\"{{ trendsTable.hasManyCols }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:10px;color:#94a3b8;margin-bottom:4px;\">↔ Scroll sideways to see all dates<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:20px;\">\n              <div style=\"display:grid;grid-template-columns:{{ trendsTable.gridColsTemplate }};font-size:12px;min-width:{{ trendsTable.minWidth }}px;width:max-content;\">\n                <div style=\"position:sticky;left:0;background:#1a3a5c;color:#fff;padding:8px 10px;white-space:nowrap;font-size:11px;letter-spacing:0.3px;z-index:1;\">Marker<\u002Fdiv>\n                <div style=\"background:#1a3a5c;color:#fff;padding:8px 10px;white-space:nowrap;font-size:11px;letter-spacing:0.3px;\">Reference<\u002Fdiv>\n                <sc-for list=\"{{ trendsTable.dateCols }}\" as=\"col\" hint-placeholder-count=\"5\">\n                  <div style=\"background:#1a3a5c;color:#fff;padding:8px 10px;white-space:nowrap;font-size:11px;letter-spacing:0.3px;\">{{ col.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"background:#1a3a5c;color:#fff;padding:8px 10px;white-space:nowrap;font-size:11px;letter-spacing:0.3px;\">Direction<\u002Fdiv>\n                <div style=\"background:#1a3a5c;color:#fff;padding:8px 10px;white-space:nowrap;font-size:11px;letter-spacing:0.3px;\">Status<\u002Fdiv>\n                <sc-for list=\"{{ trendsTable.rows }}\" as=\"row\" hint-placeholder-count=\"8\">\n                  <div style=\"display:contents;\">\n                    <div style=\"position:sticky;left:0;background:#f9fbfd;font-weight:600;padding:7px 10px;border-bottom:1px solid #e2e8f0;white-space:nowrap;\">{{ row.name }}<\u002Fdiv>\n                    <div style=\"padding:7px 10px;border-bottom:1px solid #e2e8f0;white-space:nowrap;\">\n                      <span style=\"background:#f1f5f9;color:#64748b;border-radius:9999px;padding:2px 8px;font-size:10px;\">{{ row.rangeLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"5\">\n                      <div style=\"padding:7px 10px;border-bottom:1px solid #e2e8f0;white-space:nowrap;{{ cell.style }}\">{{ cell.display }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                    <div style=\"padding:7px 10px;border-bottom:1px solid #e2e8f0;white-space:nowrap;font-weight:600;color:{{ row.directionColor }};\">{{ row.directionIcon }} {{ row.direction }}<\u002Fdiv>\n                    <div style=\"padding:7px 10px;border-bottom:1px solid #e2e8f0;white-space:nowrap;\"><span style=\"{{ row.statusBadgeStyle }}\">{{ row.status }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isTrendsCardsView }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:20px;\">\n            <sc-for list=\"{{ narrativeTrends }}\" as=\"tr\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;\">\n                <div sc-camel-on-click=\"{{ tr.onToggle }}\" style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:6px;cursor:pointer;\">\n                  <div style=\"font-weight:700;font-size:13px;\">{{ tr.name }} <span style=\"font-weight:400;color:#94a3b8;font-size:11px;\">{{ tr.unit }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px;\">\n                    <span style=\"font-size:11px;font-weight:600;color:{{ tr.directionColor }};\">{{ tr.directionIcon }} {{ tr.direction }}<\u002Fspan>\n                    <span style=\"{{ tr.statusBadgeStyle }}\">{{ tr.status }}<\u002Fspan>\n                    <span style=\"font-size:11px;color:#94a3b8;\">{{ tr.toggleLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;\">\n                  <sc-for list=\"{{ tr.points }}\" as=\"pt\" hint-placeholder-count=\"5\">\n                    <div style=\"{{ pt.pillStyle }}\">\n                      <div style=\"font-size:9px;opacity:0.75;\">{{ pt.label }}<\u002Fdiv>\n                      <div style=\"font-size:12px;font-weight:700;\">{{ pt.value }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ tr.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9;\">\n                    <div style=\"font-size:11px;color:#64748b;margin-bottom:6px;\">Reference range: <strong style=\"color:#334155;\">{{ tr.rangeLabelDisplay }}<\u002Fstrong> · shaded band below shows the healthy range<\u002Fdiv>\n                    <svg sc-camel-view-box=\"0 0 {{ tr.chart.w }} {{ tr.chart.h }}\" width=\"100%\" height=\"140\" style=\"display:block;\">\n                      <sc-if value=\"{{ tr.chart.hasBand }}\" hint-placeholder-val=\"{{ false }}\">\n                        <rect x=\"0\" y=\"{{ tr.chart.bandY }}\" width=\"{{ tr.chart.w }}\" height=\"{{ tr.chart.bandHeight }}\" style=\"fill:#dcfce7;opacity:0.6;\"><\u002Frect>\n                      <\u002Fsc-if>\n                      <polyline points=\"{{ tr.chart.polyPoints }}\" style=\"fill:none;stroke:#2563a8;stroke-width:2;\"><\u002Fpolyline>\n                      <sc-for list=\"{{ tr.chart.points }}\" as=\"cp\" hint-placeholder-count=\"6\">\n                        <circle cx=\"{{ cp.x }}\" cy=\"{{ cp.y }}\" r=\"4\" style=\"{{ cp.dotStyle }}\"><\u002Fcircle>\n                      <\u002Fsc-for>\n                    <\u002Fsvg>\n                    <div style=\"display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;margin-top:2px;\">\n                      <span>{{ tr.firstLabel }}<\u002Fspan>\n                      <span>{{ tr.lastLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:2px;\">\n                      <sc-for list=\"{{ tr.points }}\" as=\"pt2\" hint-placeholder-count=\"5\">\n                        <div style=\"display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #f8fafc;\">\n                          <span style=\"color:#64748b;\">{{ pt2.label }}<\u002Fspan>\n                          <span style=\"color:{{ pt2.rowColor }};font-weight:600;\">{{ pt2.value }} {{ tr.unit }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ noDraws }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:60px 20px;color:#64748b;\">\n          <div style=\"font-size:40px;\">📂<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:700;color:#1a3a5c;\">No Lab Data Yet<\u002Fdiv>\n          <div style=\"font-size:13px;max-width:340px;\">Import a backup file, or add your first lab report below.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-top:6px;\">\n            <button sc-camel-on-click=\"{{ goToAddLabs }}\" style=\"background:#2563a8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;\">➕ Add New Labs<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCategoryTab }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px;\">\n        <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#2563a8;background:#ebf3fc;border-left:4px solid #2563a8;padding:7px 12px;\">{{ activeCategoryLabel }}<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;\">\n          <button sc-camel-on-click=\"{{ setCategoryViewTable }}\" style=\"{{ tableViewBtnStyle }}\">📋 Table<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setCategoryViewCards }}\" style=\"{{ cardsViewBtnStyle }}\">🗂️ Cards<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasCategoryNarrative }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ categoryNarrative.boxStyle }}\">\n          <div style=\"{{ categoryNarrative.titleStyle }}\">{{ categoryNarrative.icon }} {{ categoryNarrative.title }}<\u002Fdiv>\n          <div style=\"{{ categoryNarrative.bodyStyle }}\">{{ categoryNarrative.body }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasCategoryTests }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-if value=\"{{ isTableView }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-if value=\"{{ categoryTable.hasManyCols }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:10px;color:#94a3b8;margin-bottom:4px;\">↔ Scroll sideways to see all dates<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"ove -radius:8px;padding:12px;\">\n            <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;\">Conditions<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;color:#1a3a5c;\">{{ symStats.conditions }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px;\">\n            <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;\">Needs Attn<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;color:#dc2626;\">{{ symStats.needsAttention }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;\">\n            <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;\">Manageable<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;color:#16a34a;\">{{ symStats.manageable }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;\">\n          <input value=\"{{ symHistorySearch }}\" sc-camel-on-change=\"{{ setSymSearch }}\" placeholder=\"🔍 Search…\" style=\"flex:1;min-width:180px;border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;font-size:12px;\">\n          <button sc-camel-on-click=\"{{ exportSymHistory }}\" style=\"background:none;border:1px solid #cbd5e1;color:#475569;border-radius:6px;padding:8px 14px;font-size:12px;cursor:pointer;\">↓ Export<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasSymptomCards }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;\">\n            <sc-for list=\"{{ symptomVaultFiltered }}\" as=\"card\" hint-placeholder-count=\"4\">\n              <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;\">\n                <div style=\"padding:12px 14px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;\">\n                  <div>\n                    <div style=\"font-size:13px;font-weight:700;\">{{ card.condition }}<\u002Fdiv>\n                    <div style=\"font-size:10px;color:#94a3b8;margin-top:2px;\">📅 {{ card.date }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"background:{{ card.urgencyColor }}22;color:{{ card.urgencyColor }};border:1px solid {{ card.urgencyColor }}44;border-radius:9999px;padding:3px 9px;font-size:10px;font-weight:700;white-space:nowrap;\">{{ card.urgencyShort }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:8px;\">\n                  <sc-if value=\"{{ card.hasSummary }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div><div style=\"font-size:9px;font-weight:700;text-transform:uppercase;color:#2563a8;margin-bottom:2px;\">Summary<\u002Fdiv><div style=\"font-size:11px;color:#475569;line-height:1.5;\">{{ card.summary }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ card.hasRemedies }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div><div style=\"font-size:9px;font-weight:700;text-transform:uppercase;color:#16a34a;margin-bottom:2px;\">🌿 Home Remedies<\u002Fdiv>\n                      <sc-for list=\"{{ card.remedies }}\" as=\"r\" hint-placeholder-count=\"2\"><div style=\"font-size:11px;color:#475569;\">• {{ r }}<\u002Fdiv><\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ card.hasOtc }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div><div style=\"font-size:9px;font-weight:700;text-transform:uppercase;color:#d97706;margin-bottom:2px;\">💊 OTC<\u002Fdiv>\n                      <sc-for list=\"{{ card.otc }}\" as=\"o\" hint-placeholder-count=\"2\"><d {{ hasRawRows }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;\">\n            <sc-for list=\"{{ rawView }}\" as=\"draw\" hint-placeholder-count=\"3\">\n              <div>\n                <div style=\"display:flex;justify-content:space-between;align-items:center;background:#ebf3fc;border-left:4px solid #2563a8;padding:6px 12px;font-size:11px;font-weight:700;color:#1e3a8a;margin-bottom:0;\">\n                  <span>{{ draw.dateDisplay }} — {{ draw.provider }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ draw.onDelete }}\" style=\"background:none;border:none;color:#dc2626;font-size:11px;font-weight:700;cursor:pointer;\">Delete Draw<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"border:1px solid #e2e8f0;border-top:none;border-radius:0 0 8px 8px;overflow:hidden;\">\n                  <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1fr 0.7fr;font-size:12px;\">\n                    <div style=\"background:#1a3a5c;color:#fff;padding:7px 10px;font-size:11px;\">Test<\u002Fdiv>\n                    <div style=\"background:#1a3a5c;color:#fff;padding:7px 10px;font-size:11px;\">Value<\u002Fdiv>\n                    <div style=\"background:#1a3a5c;color:#fff;padding:7px 10px;font-size:11px;\">Reference<\u002Fdiv>\n                    <div style=\"background:#1a3a5c;color:#fff;padding:7px 10px;font-size:11px;\">Flag<\u002Fdiv>\n                    <sc-for list=\"{{ draw.rows }}\" as=\"t\" hint-placeholder-count=\"6\">\n                      <div style=\"display:contents;\">\n                        <div style=\"padding:6px 10px;border-top:1px solid #f1f5f9;\">{{ t.name }}<\u002Fdiv>\n                        <div style=\"padding:6px 10px;border-top:1px solid #f1f5f9;color:{{ t.fg }};font-weight:700;\">{{ t.value }} {{ t.unit }}<\u002Fdiv>\n                        <div style=\"padding:6px 10px;border-top:1px solid #f1f5f9;color:#64748b;\">{{ t.range }}<\u002Fdiv>\n                        <div style=\"padding:6px 10px;border-top:1px solid #f1f5f9;color:{{ t.fg }};font-weight:700;\">{{ t.flagLabel }}<\u002Fdiv>\n                        <sc-if value=\"{{ t.hasExplanation }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"grid-column:1 / -1;background:#f5f3ff;color:#5b21b6;font-size:11px;font-style:italic;padding:6px 10px;\">{{ t.explanation }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noRawRows }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#64748b;font-size:13px;\">No results match your current filters.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noDraws }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"color:#64748b;font-size:13px;\">No draws recorded yet.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showSettings }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;\" sc-camel-on-click=\"{{ closeSettings }}\">\n      <div style=\"background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);\" sc-camel-on-click=\"{{ stopPropagation }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0;\">\n          <div style=\"font-size:16px;font-weight:700;color:#1a3a5c;\">⚙️ Settings<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeSettings }}\" style=\"background:none;border:none;font-size:18px;cursor:pointer;color:#64748b;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;padding:12px 20px 0;border-bottom:1px solid #f1f5f9;\">\n          <sc-for list=\"{{ settingsSections }}\" as=\"sec\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ sec.onClick }}\" style=\"{{ sec.style }}\">{{ sec.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:18px 20px;\">\n          <sc-if value=\"{{ isSettingsApi }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-weight:700;font-size:13px;margin-bottom:6px;\">Groq API Key<\u002Fdiv>\n            <div style=\"font-size:11px;color:#64748b;margin-bottom:8px;\">Used to auto-extract lab values from pasted text, PDFs, and images. Stored only in this browser (localStorage) — sent only directly to Groq's API when you click \"Parse\".<\u002Fdiv>\n            <input type=\"password\" value=\"{{ groqKey }}\" sc-camel-on-change=\"{{ setGroqKey }}\" placeholder=\"gsk_...\" style=\"border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;font-size:12px;width:100%;box-sizing:border-box;\">\n            <div style=\"font-size:11px;margin-top:6px;\"><a href=\"https://console.groq.com/keys\" target=\"_blank\" rel=\"noopener\">Get a free API key from console.groq.com →<\u002Fa><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;\">\n              <div style=\"display:flex;flex-direction:column;gap:3px;\">\n                <label style=\"font-size:10px;color:#64748b;\">Text model<\u002Flabel>\n                <input value=\"{{ groqTextModel }}\" sc-camel-on-change=\"{{ setGroqTextModel }}\" style=\"border:1px solid #cbd5e1;border-radius:6px;padding:5px 8px;font-size:11px;width:220px;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:3px;\">\n                <label style=\"font-size:10px;color:#64748b;\">Vision model<\u002Flabel>\n                <input value=\"{{ groqVisionModel }}\" sc-camel-on-change=\"{{ setGroqVisionModel }}\" style=\"border:1px solid #cbd5e1;border-radius:6px;padding:5px 8px;font-size:11px;width:220px;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#94a3b8;margin-top:6px;\">Model names occasionally change on Groq's side — if parsing fails with a \"model not found\" error, update these.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isSettingsBackup }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-weight:700;font-size:13px;margin-bottom:6px;\">Backup &amp; Restore<\u002Fdiv>\n            <div style=\"font-size:11px;color:#64748b;margin-bottom:10px;\">All labs, patient info, and imaging live only in this browser. Download a backup regularly — clearing browser data or switching devices without one means losing everything.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;\">\n              <button sc-camel-on-click=\"{{ exportBackup }}\" style=\"background:#2563a8;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;\">💾 Download Backup<\u002Fbutton>\n              <label style=\"background:#f1f5f9;color:#334155;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;\">📥 Import Backup<input type=\"file\" accept=\".json\" sc-camel-on-change=\"{{ onImportBackup }}\" style=\"display:none;\"><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#64748b;\">{{ backupStatusText }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isSettingsApps }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-weight:700;font-size:13px;margin-bottom:10px;\">Related Apps<\u002Fdiv>\n            <div style=\"font-size:11px;color:#64748b;margin-bottom:14px;\">Other tools in this personal app suite that pair well with your lab data.<\u002Fdiv>\n  record, and wellness management suite — including an AI symptom checker with saved history.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:18px;color:#94a3b8;flex-shrink:0;\">→<\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isSettingsHelp }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:14px;\">\n              <div>\n                <div style=\"font-weight:700;font-size:13px;color:#1a3a5c;\">Adding new labs<\u002Fdiv>\n                <div style=\"font-size:12px;color:#475569;margin-top:3px;\">Go to \"Add New Labs\" → paste report text or upload a PDF/image → Parse with Groq → review/edit the extracted rows → Add to Dashboard. Scanned (image-only) PDFs need the image upload path, not the PDF one.<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-weight:700;font-size:13px;color:#1a3a5c;\">Body Map &amp; Imaging<\u002Fdiv>\n                <div style=\"font-size:12px;color:#475569;margin-top:3px;\">Click a body region to filter your imaging gallery to that area. Upload X-rays, MRIs, CT scans, ultrasounds, or photos and tag them with a region, type, and date.<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-weight:700;font-size:13px;color:#1a3a5c;\">Trends<\u002Fdiv>\n                <div style=\"font-size:12px;color:#475569;margin-top:3px;\">Each category tab (Lipids, CBC, etc.) shows every test's latest value plus its history across draws, with an arrow showing direction of change.<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-weight:700;font-size:13px;color:#1a3a5c;\">Backups<\u002Fdiv>\n                <div style=\"font-size:12px;color:#475569;margin-top:3px;\">Nothing is stored on a server — everything lives in this browser. Download a backup after adding data, and re-import it on any device to pick up where you left off.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,0.25);z-index:999;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <button sc-camel-on-click=\"{{ openPrintModal }}\" title=\"Print / Save PDF\" style=\"position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:#16a34a;color:#fff;border:none;box-shadow:0 4px 16px rgba(0,0,0,0.25);font-size:20px;cursor:pointer;z-index:150;display:flex;align-items:center;justify-content:center;\">📄<\u002Fbutton>\n\n  <sc-if value=\"{{ showPrintModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;\" sc-camel-on-click=\"{{ closePrintModal }}\">\n      <div style=\"background:#fff;border-radius:12px;max-width:420px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);\" sc-camel-on-click=\"{{ stopPropagation }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0;\">\n          <div style=\"font-size:16px;font-weight:700;color:#1a3a5c;\">📄 Print / Save as PDF<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closePrintModal }}\" style=\"background:none;border:none;font-size:18px;cursor:pointer;color:#64748b;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:16px 20px;\">\n          <div style=\"font-size:12px;color:#64748b;margin-bottom:10px;\">Choose which sections to include, then generate a clean print-ready view.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;\">\n            <sc-for list=\"{{ printOptions }}\" as=\"opt\" hint-placeholder-count=\"10\">\n              <div sc-camel-on-click=\"{{ opt.onToggle }}\" style=\"display:flex;align-items:center;gap:10px;padding:7px 4px;cursor:pointer;font-size:13px;border-bottom:1px solid #f8fafc;\">\n                <span style=\"font-size:16px;\">{{ opt.checkIcon }}<\u002Fspan>\n                <span>{{ opt.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;display:flex;gap:8px;\">\n            <button sc-camel-on-click=\"{{ generatePrintView }}\" style=\"background:#2563a8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;\">Generate Print View<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ closePrintModal }}\" style=\"background:none;border:1px solid #cbd5e1;color:#475569;border-radius:8px;padding:10px 16px;font-size:13px;cursor:pointer;\">Cancel<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ printMode }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;min-height:100vh;color:#1e293b;font-size:13px;line-height:1.5;max-width:960px;margin:0 auto;padding:24px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid #e2e8f0;\">\n      <div>\n        <div style=\"font-size:18px;font-weight:700;color:#1a3a5c;\">{{ printPatientName }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:#64748b;margin-top:2px;\">Lab Report · Generated {{ printGeneratedDate }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;\">\n        <button sc-camel-on-click=\"{{ triggerBrowserPrint }}\" style=\"background:#2563a8;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;\">🖨️ Print Now<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ exitPrintView }}\" style=\"background:none;border:1px solid #cbd5e1;color:#475569;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;\">← Back to Dashboard<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ printPanels }}\" as=\"panel\" hint-placeholder-count=\"3\">\n      <div style=\"margin-bottom:32px;\">\n        <div style=\"font-size:14px;font-weight:700;color:#1a3a5c;background:#ebf3fc;border-left:4px solid #2563a8;padding:8px 12px;margin-bottom:14px;\">{{ panel.label }}<\u002Fdiv>\n\n        <sc-if value=\"{{ panel.isSummaryKind }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ panel.hasNarrative }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px;\">\n              <sc-for list=\"{{ panel.snapshot }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <div style=\"{{ s.cardStyle }}\">\n                  <div style=\"font-size:9px;font-weight:700;text-transform:uppercase;color:#64748b;\">{{ s.name }}<\u002Fdiv>\n                  <div style=\"font-size:16px;font-weight:700;margin-top:3px;color:{{ s.valueColor }}\">{{ s.value }} <span style=\"font-size:10px;font-weight:400;color:#64748b;\">{{ s.unit }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ panel.flags }}\" as=\"fl\" hint-placeholder-count=\"4\">\n              <div style=\"{{ fl.boxStyle }} margin-bottom:8px;\">\n                <div style=\"{{ fl.titleStyle }}\">{{ fl.icon }} {{ fl.title }}<\u002Fdiv>\n                <div style=\"{{ fl.bodyStyle }}\">{{ fl.body }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ panel.noNarrative }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#94a3b8;font-size:12px;font-style:italic;\">No AI clinical summary was generated for this report.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ panel.isCategoryKind }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ panel.hasCatNarrative }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ panel.catNarrative.boxStyle }}\">\n              <div style=\"{{ panel.catNarrative.titleStyle }}\">{{ panel.catNarrative.icon }} {{ panel.catNarrative.title }}<\u002Fdiv>\n              <div style=\"{{ panel.catNarrative.bodyStyle }}\">{{ panel.catNarrative.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ panel.hasRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"overflow-x:auto;margin-top:10px;\">\n              <div style=\"display:grid;grid-template-columns:{{ panel.table.gridColsTemplate }};font-size:11px;\">\n                <div style=\"background:#1a3a5c;color:#fff;padding:6px 8px;\">Marker<\u002Fdiv>\n                <div style=\"background:#1a3a5c;color:#fff;padding:6px 8px;\">Reference<\u002Fdiv>\n                <sc-for list=\"{{ panel.table.dateCols }}\" as=\"col\" hint-placeholder-count=\"5\">\n                  <div style=\"background:#1a3a5c;color:#fff;padding:6px 8px;\">{{ col.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ panel.table.rows }}\" as=\"row\" hint-placeholder-count=\"8\">\n                  <div style=\"display:contents;\">\n                    <div style=\"padding:5px 8px;border-bottom:1px solid #e2e8f0;font-weight:600;\">{{ row.name }}<\u002Fdiv>\n                    <div style=\"padding:5px 8px;border-bottom:1px solid #e2e8f0;color:#64748b;\">{{ row.rangeLabel }}<\u002Fdiv>\n                    <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"5\">\n                      <div style=\"padding:5px 8px;border-bottom:1px solid #e2e8f0;{{ cell.style }}\">{{ cell.display }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ panel.hasRisk }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12px;font-weight:700;color:#1a3a5c;margin:16px 0 8px;\">{{ panel.label }} Risk Assessment<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.4fr 1.6fr 2.4fr;font-size:11px;\">\n              <div style=\"background:#1a3a5c;color:#fff;padding:6px 8px;\">Risk Factor<\u002Fdiv>\n              <div style=\"background:#1a3a5c;color:#fff;padding:6px 8px;\">Current Status<\u002Fdiv>\n              <div style=\"background:#1a3a5c;color:#fff;padding:6px 8px;\">Clinical Note<\u002Fdiv>\n              <sc-for list=\"{{ panel.risk }}\" as=\"rf\" hint-placeholder-count=\"4\">\n                <div style=\"display:contents;\">\n                  <div style=\"padding:5px 8px;border-bottom:1px solid #e2e8f0;font-weight:600;\">{{ rf.factor }}<\u002Fdiv>\n                  <div style=\"padding:5px 8px;border-bottom:1px solid #e2e8f0;color:{{ rf.valueColor }};font-weight:700;\">{{ rf.value }}<\u002Fdiv>\n                  <div style=\"padding:5px 8px;border-bottom:1px solid #e2e8f0;color:#475569;\">{{ rf.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ panel.isRawKind }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ panel.rawDraws }}\" as=\"draw\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:14px;\">\n              <div style=\"font-weight:700;font-size:12px;margin-bottom:4px;\">{{ draw.date }} <span style=\"color:#64748b;font-weight:400;\">— {{ draw.provider }}<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ draw.tests }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-top:1px solid #f1f5f9;\">\n                  <span>{{ t.name }} <span style=\"color:#94a3b8;\">({{ t.categoryLabel }})<\u002Fspan><\u002Fspan>\n                  <span style=\"color:{{ t.fg }};font-weight:600;\">{{ t.value }} {{ t.unit }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    activeTab: 'summary',\n    patient: { name: '', dob: '', sex: '' },\n    draws: [],\n    imaging: [],\n    groqKey: '',\n    groqTextModel: 'llama-3.3-70b-versatile',\n    groqVisionModel: 'llama-3.2-90b-vision-preview',\n    bodyRegionFilter: null,\n    imagingSort: 'date-desc',\n    addImagingForm: { files: [], region: 'other', type: 'X-ray', date: '', note: '' },\n    addLabsMode: 'paste',\n    addLabs: { pasteText: '', fileName: '', fileDataUrl: '', fileKind: '', parsing: false, parseError: '', parsedDraws: [] },\n    narrativeSummary: null,\n    narrativeGenerating: false,\n    narrativeError: '',\n    narrativeGeneratedAt: null,\n    expandedTrends: {},\n    categoryViewMode: 'table',\n    trendsViewMode: 'cards',\n    rawSort: 'date_asc',\n    rawProviderFilter: '',\n    rawSearch: '',\n    rawFlaggedOnly: false,\n    rawShowExplanations: false,\n    symptomTab: 'chat',\n    symChatHistory: [],\n    symInput: '',\n    symSending: false,\n    symCurrentAdvice: null,\n    symptomVault: [],\n    symHistorySearch: '',\n    showPrintModal: false,\n    printSelection: {},\n    printMode: false,\n    printSelectedKeys: [],\n    lastBackupAt: null,\n    lastChangeAt: null,\n    toast: null,\n    showSettings: false,\n    settingsSection: 'api',\n  };\n\n  regionDefs = [\n    { key: 'head', label: 'Head / Brain', x: 128, y: 8, w: 118, h: 108, rx: 40 },\n    { key: 'neck', label: 'Neck / Thyroid', x: 160, y: 112, w: 54, h: 34, rx: 10 },\n    { key: 'chest', label: 'Chest / Lungs', x: 100, y: 142, w: 175, h: 160, rx: 20 },\n    { key: 'abdomen', label: 'Abdomen', x: 112, y: 296, w: 150, h: 106, rx: 16 },\n    { key: 'pelvis', label: 'Pelvis', x: 118, y: 396, w: 140, h: 78, rx: 20 },\n    { key: 'left-arm', label: 'Left Arm', x: 14, y: 148, w: 88, h: 285, rx: 28 },\n    { key: 'right-arm', label: 'Right Arm', x: 272, y: 148, w: 88, h: 285, rx: 28 },\n    { key: 'left-leg', label: 'Left Leg', x: 128, y: 466, w: 68, h: 265, rx: 22 },\n    { key: 'right-leg', label: 'Right Leg', x: 198, y: 466, w: 68, h: 265, rx: 22 },\n    { key: 'spine', label: 'Spine / Back', x: 178, y: 142, w: 20, h: 330, rx: 8 },\n  ];\n\n  tabsDef = [\n    { key: 'summary', label: 'Summary' },\n    { key: 'lipids', label: 'Lipids & Cardio' },\n    { key: 'metabolic', label: 'Metabolic / CMP' },\n    { key: 'cbc', label: 'CBC / Hematology' },\n    { key: 'hormones', label: 'Hormones & Thyroid' },\n    { key: 'nutrients', label: 'Nutrients & Iron' },\n    { key: 'autoimmune', label: 'Autoimmune / Inflammation' },\n    { key: 'infectious', label: 'Infectious Disease' },\n    { key: 'urinalysis', label: 'Urinalysis' },\n    { key: 'symptoms', label: '🩺 Symptom Checker' },\n    { key: 'bodymap', label: 'Body Map & Imaging' },\n    { key: 'addlabs', label: 'Add New Labs' },\n    { key: 'rawlabs', label: 'All Raw Labs' },\n  ];\n\n  categoryKeys = ['lipids', 'metabolic', 'cbc', 'hormones', 'nutrients', 'autoimmune', 'infectious', 'urinalysis'];\n  imagingTypeOptions = ['X-ray', 'MRI', 'CT', 'Ultrasound', 'Photo', 'Other'];\n  flagOptions = ['normal', 'low', 'high', 'critical'];\n  toastTimer = null;\n\n  testExplanations = {\n    'Total Cholesterol': 'The sum of all cholesterol in your blood. High levels increase heart disease risk. Includes LDL, HDL, and VLDL particles.',\n    'HDL Cholesterol': \"High-Density Lipoprotein — the 'good' cholesterol. Carries cholesterol away from arteries back to the liver. Higher is better; low HDL raises cardiovascular risk.\",\n    'HDL-Cholesterol': \"High-Density Lipoprotein — the 'good' cholesterol. Carries cholesterol away from arteries back to the liver. Higher is better; low HDL raises cardiovascular risk.\",\n    'LDL Cholesterol': \"Low-Density Lipoprotein — the 'bad' cholesterol. High LDL deposits plaque in artery walls, increasing heart attack and stroke risk. Primary target for cholesterol treatment.\",\n    'LDL-Cholesterol': \"Low-Density Lipoprotein — the 'bad' cholesterol. High LDL deposits plaque in artery walls, increasing heart attack and stroke risk. Primary target for cholesterol treatment.\",\n    'Triglycerides': 'A type of fat in your blood derived from calories you don\\'t use immediately. High levels (>150) raise risk of heart disease and pancreatitis.',\n    'Chol/HDL Ratio': 'Total Cholesterol divided by HDL. A low ratio means more protective HDL relative to total cholesterol. Below 5.0 is desirable; below 3.5 is excellent.',\n    'Non-HDL Cholesterol': 'All cholesterol that is not HDL (includes LDL, VLDL, and Lp(a)). Considered a strong predictor of cardiovascular risk, sometimes better than LDL alone.',\n    'ApoB': 'Apolipoprotein B — one particle per atherogenic lipoprotein. Considered a more accurate marker of cardiovascular risk than LDL-C alone since it counts particles, not just cholesterol mass.',\n    'Lipoprotein(a)': 'Lp(a) — a genetically-determined LDL-like particle. Elevated levels raise cardiovascular risk independent of other lipids and are not significantly affected by diet or exercise.',\n    'hs-CRP': 'High-sensitivity C-Reactive Protein — a marker of systemic inflammation. Elevated levels are associated with cardiovascular risk, but can also reflect infection or acute illness.',\n    'Glucose': 'Blood sugar level. Elevated fasting glucose (>99) suggests pre-diabetes; >125 on repeat testing indicates diabetes. Used to screen for metabolic disorders.',\n    'Glucose (fasting)': 'Blood sugar level. Elevated fasting glucose (>99) suggests pre-diabetes; >125 on repeat testing indicates diabetes. Used to screen for metabolic disorders.',\n    'HbA1c': 'Reflects average blood sugar over the past 2-3 months. Used to diagnose and monitor diabetes; below 5.7% is normal, 5.7-6.4% is pre-diabetic, 6.5%+ is diabetic.',\n    'BUN': 'Blood Urea Nitrogen — a waste product filtered by the kidneys. Elevated BUN may indicate kidney dysfunction, dehydration, or high protein intake.',\n    'Creatinine': 'A muscle waste product cleared by the kidneys. Elevated creatinine signals reduced kidney filtration. Used alongside eGFR to assess kidney function.',\n    'eGFR': 'Estimated Glomerular Filtration Rate — the best overall measure of kidney function. Below 60 for 3+ months suggests chronic kidney disease.',\n    'Sodium': 'An electrolyte that regulates fluid balance and nerve/muscle function. Abnormal levels can reflect hydration status, kidney function, or hormone imbalances.',\n    'Potassium': 'An electrolyte critical for heart rhythm and muscle function. Both high and low levels can be dangerous and require prompt evaluation.',\n    'Calcium': 'Regulates bone health, muscle contraction, and nerve signaling. Abnormal levels can point to bone, kidney, or parathyroid issues.',\n    'ALT': 'Alanine Aminotransferase — a liver enzyme. Elevated levels suggest liver cell damage or inflammation, commonly from fatty liver, alcohol, or medications.',\n    'AST': 'Aspartate Aminotransferase — a liver and muscle enzyme. Elevated levels can indicate liver damage, but also muscle injury or strenuous exercise.',\n    'Lipase': 'An enzyme produced by the pancreas to digest fat. Markedly elevated levels suggest pancreatitis (pancreatic inflammation).',\n    'Amylase': 'An enzyme that breaks down starches, produced mainly by the pancreas and salivary glands. Elevated levels often accompany pancreatitis alongside lipase.',\n    'TSH': 'Thyroid Stimulating Hormone — the primary screening test for thyroid function. High TSH suggests an underactive thyroid; low TSH suggests an overactive thyroid.',\n    'Free T4': 'The active, unbound form of thyroxine. Used with TSH to clarify thyroid function, especially when TSH is abnormal.',\n    'Free T3': 'The active, unbound form of triiodothyronine, the most potent thyroid hormone. Helps clarify thyroid status alongside TSH and Free T4.',\n    'Testosterone': 'The primary male sex hormone, also present in smaller amounts in women. Low levels can affect energy, mood, muscle mass, and libido.',\n    'Vitamin D': 'Supports bone health, immune function, and calcium absorption. Deficiency is common and linked to fatigue, bone loss, and immune dysfunction.',\n    'Ferritin': 'Reflects the body\\'s stored iron. Low levels indicate iron deficiency; high levels can reflect iron overload or inflammation.',\n    'Iron': 'Circulating serum iron, used with ferritin and iron saturation to assess for iron deficiency or overload.',\n    'Iron Saturation': 'The percentage of iron-binding capacity occupied by iron. Low values suggest iron deficiency; high values suggest iron overload.',\n    'Vitamin B12': 'Essential for nerve function and red blood cell production. Deficiency can cause fatigue, nerve symptoms, and a specific type of anemia.',\n    'Folate': 'A B-vitamin essential for DNA synthesis and red blood cell production. Deficiency can cause anemia and is important in pregnancy.',\n    'ANA': 'Antinuclear Antibody — a screening test for autoimmune disease, especially lupus. A positive result alone does not confirm disease; many healthy people test mildly positive.',\n    'Rheumatoid Factor': 'An antibody often elevated in rheumatoid arthritis, though it can also appear in other autoimmune or chronic eflect chronic infection, inflammation, or immune disorders.',\n    'A/G Ratio': 'Albumin-to-Globulin Ratio. An abnormal ratio can point toward liver or kidney disease, or conditions that overproduce antibodies.',\n    'Bilirubin': 'A byproduct of red blood cell breakdown, processed by the liver. Elevated levels cause jaundice and can indicate liver disease or excess red cell breakdown.',\n    'Total Bilirubin': 'A byproduct of red blood cell breakdown, processed by the liver. Elevated levels cause jaundice and can indicate liver disease or excess red cell breakdown.',\n    'Alkaline Phosphatase': 'An enzyme found in liver and bone. Elevated levels suggest bile duct obstruction, liver disease, or active bone turnover/growth.',\n    'GGT': 'Gamma-Glutamyl Transferase — a liver enzyme especially sensitive to alcohol use and bile duct issues. Often checked alongside ALT/AST/Alkaline Phosphatase.',\n    'Uric Acid': 'A waste product from purine breakdown. Elevated levels can cause gout (joint inflammation) and kidney stones.',\n    'Magnesium': 'An electrolyte and cofactor for hundreds of enzymes, important for muscle, nerve, and heart function. Deficiency is common and often under-tested.',\n    'Phosphorus': 'Works closely with calcium for bone health and cellular energy. Abnormal levels often relate to kidney function or parathyroid hormone activity.',\n    'LH': 'Luteinizing Hormone — a pituitary hormone that triggers ovulation in women and testosterone production in men. Used to evaluate fertility and hormonal axis function.',\n    'FSH': 'Follicle-Stimulating Hormone — a pituitary hormone that drives egg or sperm development. Elevated levels can indicate declining ovarian or testicular function.',\n    'Estradiol': 'The primary form of estrogen. Used to assess ovarian function, menopause status, and hormone therapy in women, and hormonal balance in men.',\n    'Progesterone': 'A hormone that supports the uterine lining and pregnancy. Used to confirm ovulation and ssarily active symptoms.',\n    'Urinalysis — Protein': 'Detects protein in the urine. Trace amounts can be benign, but persistent or higher levels can indicate kidney issues.',\n    'Urinalysis — Ketones': 'Detects ketones, byproducts of fat breakdown. Can appear with fasting, low-carb diets, or poorly controlled diabetes.',\n    'Urinalysis — Glucose': 'Detects glucose in the urine, which normally should not be present. Its presence can indicate blood sugar levels above the kidney\\'s reabsorption threshold.',\n    'Urinalysis — Blood': 'Detects blood in the urine, which can arise from urinary tract infection, kidney stones, or other urinary tract causes and generally warrants follow-up.',\n    'Urinalysis — Leukocyte Esterase': 'An enzyme marker suggesting white blood cells (and possible infection) in the urine.',\n    'Urinalysis — Nitrite': 'A byproduct produced by certain bacteria; a positive result suggests a likely urinary tract infection.',\n    'Specific Gravity': 'A measure of urine concentration, reflecting hydration status and kidney concentrating ability.',\n    'pH': 'A measure of urine acidity. Can be affected by diet, certain medications, and some metabolic or urinary tract conditions.',\n    'Leptin': 'A hormone made by fat cells that signals fullness to the brain. Levels generally track with body fat percentage; low levels can occur with very low body fat.',\n  };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem('cld_data_v1');\n      if (raw) {\n        const d = JSON.parse(raw);\n        this.setState({ patient: d.patient || { name: '', dob: '', sex: '' }, draws: d.draws || [], imaging: d.imaging || [], narrativeSummary: d.narrativeSummary || null, narrativeGeneratedAt: d.narrativeGeneratedAt || null, symptomVault: d.symptomVault || [], lastBackupAt: d.lastBackupAt || null, lastChangeAt: d.lastChangeAt || null });\n      }\n      const g = localStorage.getItem('cld_groq_v1');\n      if (g) {\n        const gd = JSON.
